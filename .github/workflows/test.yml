name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: /bin/bash --version
      # /bin/bash on purpose: on macOS it is 3.2, which is the portability test.
      - run: /bin/bash tests/run.sh
